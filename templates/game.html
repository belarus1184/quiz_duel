<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Викторина-Дуэль — Кто умнее?</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .game-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 32px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .header-title {
            text-align: center;
            font-size: 1.5rem;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffd966;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }
        .score-card {
            flex: 1;
            background: #1e293b;
            border-radius: 32px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-bottom: 4px solid #ffd966;
        }
        .score-label {
            font-size: 1rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .score-value {
            font-size: 3rem;
            font-weight: 800;
            color: #facc15;
            line-height: 1;
        }
        .question-info {
            text-align: center;
            margin-bottom: 20px;
            color: #cbd5e1;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .question-area {
            background: #0f172a;
            border-radius: 48px;
            padding: 32px;
            margin-bottom: 32px;
            text-align: center;
            border: 1px solid #334155;
        }
        .timer {
            font-size: 2rem;
            font-weight: 700;
            background: #1e293b;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            margin-bottom: 24px;
            color: #facc15;
            font-family: monospace;
        }
        .question {
            font-size: 1.6rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 32px;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .option-btn {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 80px;
            padding: 16px 12px;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) {
            background: #334155;
            transform: scale(1.02);
        }
        .option-btn.selected {
            background: #eab308;
            color: #0f172a;
            border-color: #eab308;
        }
        .option-btn.correct-highlight {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }
        .option-btn.wrong-highlight {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s;
        }
        .modal.visible { visibility: visible; opacity: 1; }
        .modal-content {
            background: #1e293b;
            border-radius: 48px;
            padding: 32px 48px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid #475569;
        }
        .modal-content h3 { font-size: 1.8rem; margin-bottom: 20px; color: #facc15; }
        .modal-results {
            font-size: 1.1rem;
            margin: 15px 0;
            line-height: 1.6;
            color: white !important;
        }
        .modal-results div {
            margin: 5px 0;
        }
        .correct-answer {
            background: #22c55e !important;
            padding: 8px;
            border-radius: 40px;
            margin-top: 10px;
            color: white !important;
            font-weight: bold;
        }
        @media (max-width: 680px) {
            .options { grid-template-columns: 1fr; }
            .question { font-size: 1.2rem; }
            .score-value { font-size: 2rem; }
            .timer { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header-title">📖 Интеллектуальная дуэль «Кто умнее»</div>
    <div class="scoreboard">
        <div class="score-card"><div class="score-label" id="label1">{{ name1 }}</div><div class="score-value" id="score1">0</div></div>
        <div class="score-card"><div class="score-label" id="label2">{{ name2 }}</div><div class="score-value" id="score2">0</div></div>
    </div>
    <div class="question-info" id="questionCounter"></div>
    <div class="question-area">
        <div class="timer" id="timer">⏱️ --</div>
        <div class="question" id="question">Ожидание соперника...</div>
        <div class="options" id="options"></div>
    </div>
</div>

<div id="resultModal" class="modal">
    <div class="modal-content">
        <h3>📊 Результаты раунда</h3>
        <div id="modalResults" class="modal-results"></div>
        <div id="modalCorrect" class="correct-answer"></div>
    </div>
</div>

<script>
    const sid = "{{ sid }}";
    const myIdx = {{ player_idx }};
    const totalQ = {{ total_questions }};
    let currentQ = -1;
    let canAnswer = true;
    let timerInt = null;
    let selectedBtn = null;
    let gameActive = true;
    let pollInterval = null;
    let roundResultShown = false;
    let lastTimeLeft = -1;

    function fetchState() {
        fetch('/state')
            .then(response => response.json())
            .then(state => {
                if (state.error) return;
                
                if (state.scores) {
                    document.getElementById('score1').innerText = state.scores[0];
                    document.getElementById('score2').innerText = state.scores[1];
                }
                if (state.players) {
                    document.getElementById('label1').innerText = state.players[0];
                    document.getElementById('label2').innerText = state.players[1];
                }
                
                // Окончание игры
                if (state.game_over) {
                    if (pollInterval) clearInterval(pollInterval);
                    gameActive = false;
                    let message = '';
                    if (state.winner === null) {
                        message = `🤝 Ничья! Счёт ${state.scores[0]} : ${state.scores[1]}`;
                    } else if (state.winner === (myIdx === 0 ? state.players[0] : state.players[1])) {
                        message = `🏆 ПОЗДРАВЛЯЕМ! Вы победили!\nИтог игры: Игрок ${state.winner} победил со счётом ${state.winner_score} : ${state.loser_score}`;
                    } else {
                        message = `Итог игры: Игрок ${state.winner} победил со счётом ${state.winner_score} : ${state.loser_score}`;
                    }
                    document.getElementById('question').innerHTML = message.replace(/\n/g, '<br>');
                    document.getElementById('options').innerHTML = '';
                    document.getElementById('timer').style.display = 'none';
                    document.getElementById('questionCounter').innerHTML = '';
                    return;
                }
                
                // Активный раунд
                if (state.round_active && state.question) {
                    if (currentQ !== state.q_idx) {
                        // Новый вопрос
                        currentQ = state.q_idx;
                        canAnswer = true;
                        roundResultShown = false;
                        document.getElementById('questionCounter').innerHTML = `Вопрос ${currentQ+1} из ${state.total_questions}`;
                        document.getElementById('question').innerText = state.question;
                        const optsDiv = document.getElementById('options');
                        optsDiv.innerHTML = '';
                        state.options.forEach((opt, i) => {
                            const btn = document.createElement('button');
                            btn.innerText = opt;
                            btn.classList.add('option-btn');
                            btn.onclick = () => {
                                if (!canAnswer || !gameActive) return;
                                // Снимаем выделение с предыдущей кнопки
                                if (selectedBtn) selectedBtn.classList.remove('selected');
                                btn.classList.add('selected');
                                selectedBtn = btn;
                                // Отправляем ответ (перезаписывает предыдущий)
                                fetch('/answer', {
                                    method: 'POST',
                                    headers: {'Content-Type': 'application/json'},
                                    body: JSON.stringify({sid: sid, answer: i})
                                });
                            };
                            optsDiv.appendChild(btn);
                        });
                        if (timerInt) clearInterval(timerInt);
                    }
                    // Обновляем таймер
                    const timeLeft = state.time_left;
                    if (timeLeft !== lastTimeLeft) {
                        document.getElementById('timer').innerText = `⏱️ ${timeLeft}`;
                        lastTimeLeft = timeLeft;
                    }
                    if (timeLeft <= 0) {
                        document.getElementById('timer').innerText = '⏰ 0';
                        canAnswer = false;
                        if (timerInt) clearInterval(timerInt);
                    }
                } 
                // Раунд завершён – показываем модальное окно (только один раз)
                else if (!state.round_active && !roundResultShown && !state.game_over && state.q_idx > 0) {
                    if (state.round_result) {
                        roundResultShown = true;
                        const messages = state.round_result.messages;
                        const modal = document.getElementById('resultModal');
                        // Правильные ответы – зелёная галочка, неправильные – красный крестик
                        document.getElementById('modalResults').innerHTML = messages.map(msg => {
                            if (msg.includes('правильно')) {
                                return `<div style="color: #86efac;">✅ ${msg}</div>`;
                            } else {
                                return `<div style="color: #fecaca;">❌ ${msg}</div>`;
                            }
                        }).join('') + `<div style="color: white;">Промежуточный счёт: ${state.round_result.scores[0]} : ${state.round_result.scores[1]}</div>`;
                        document.getElementById('modalCorrect').innerHTML = `✅ Правильный ответ: ${state.round_result.correct_text}`;
                        modal.classList.add('visible');
                        setTimeout(() => modal.classList.remove('visible'), 3000);
                        canAnswer = false;
                        if (timerInt) clearInterval(timerInt);
                    }
                }
            })
            .catch(err => console.log(err));
    }
    
    pollInterval = setInterval(fetchState, 800);
    fetchState();
</script>
</body>
</html>
